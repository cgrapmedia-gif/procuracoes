# Render Blueprint — API da Plataforma de Procurações.
# Render → New → Blueprint → escolher este repositório. Os valores marcados "sync: false" são pedidos no ecrã.
services:
  - type: web
    name: procuracoes-api
    runtime: docker
    region: frankfurt
    plan: standard            # 2 GB RAM: necessário para o Chromium que gera os PDF
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    preDeployCommand: node dist/db/migrate.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL          # Neon, branch main, POOLED, role procuracoes_app (sem aspas)
        sync: false
      - key: DATABASE_URL_DIRECT   # Neon, branch main, DIRECT, role neondb_owner (sem aspas)
        sync: false
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_CONNECT_TIMEOUT_MS
        value: "15000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: "900"
      - key: REFRESH_TTL_DAYS
        value: "7"
      - key: DATA_ENC_KEY          # openssl rand -base64 32  (guardar em cofre!)
        sync: false
      - key: DATA_BIDX_KEY         # openssl rand -base64 48
        sync: false
      - key: PROXY_SECRET          # openssl rand -hex 32  (o MESMO valor na Vercel)
        sync: false
      - key: TRUST_PROXY_HOPS      # Vercel → Render → API
        value: "2"
      - key: CORS_ORIGIN           # https://<domínio da aplicação na Vercel>
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT           # https://<account-id>.eu.r2.cloudflarestorage.com
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: procuracoes-documentos
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_SSE
        value: none
      - key: S3_CONDITIONAL_WRITES
        value: "false"
      - key: CHROMIUM_PATH
        value: /usr/bin/chromium
      - key: SEGREGACAO_FUNCOES
        value: "true"
