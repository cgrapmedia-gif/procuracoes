# Render Blueprint — API da Plataforma de Procurações (AMBIENTE DE TESTE, plano gratuito).
# Render → New → Blueprint → escolher este repositório. Os valores "sync: false" são pedidos no ecrã.
#
# Limites do plano gratuito (aceitáveis para testes, NÃO para produção):
#  - 512 MB de RAM: a geração de PDF (Chromium) pode falhar por falta de memória;
#  - adormece após 15 min sem uso: o primeiro pedido seguinte demora ~1 min;
#  - sem "pre-deploy": as migrações correm no arranque (dockerCommand);
#  - disco temporário: com STORAGE_DRIVER=local os PDF emitidos perdem-se quando o serviço reinicia.
services:
  - type: web
    name: procuracoes-api-teste
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS          # limita a memória do Node para sobrar espaço ao Chromium
        value: --max-old-space-size=256
      - key: DATABASE_URL          # Neon (branch de teste), POOLED, role neondb_owner (sem aspas)
        sync: false
      - key: DATABASE_URL_DIRECT   # Neon (mesmo branch), DIRECT, role neondb_owner (sem aspas)
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_CONNECT_TIMEOUT_MS
        value: "20000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: "900"
      - key: REFRESH_TTL_DAYS
        value: "7"
      - key: DATA_ENC_KEY          # openssl rand -base64 32
        sync: false
      - key: DATA_BIDX_KEY         # openssl rand -base64 48
        sync: false
      - key: PROXY_SECRET          # openssl rand -hex 32  (o MESMO valor na Vercel)
        sync: false
