# Ambiente local completo. Segredos via ficheiro .env (ver apps/api/.env.example).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: proc, POSTGRES_PASSWORD: proc, POSTGRES_DB: procuracoes }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U proc"], interval: 5s, retries: 10 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: "${S3_ACCESS_KEY:-minioadmin}", MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:-minioadmin123}" }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set l http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin123};
      mc mb -p l/procuracoes; mc version enable l/procuracoes; mc anonymous set none l/procuracoes; exit 0"
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://proc:proc@db:5432/procuracoes
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: procuracoes
    depends_on: { db: { condition: service_healthy }, minio-init: { condition: service_completed_successfully } }
    ports: ["3001:3001"]
    command: sh -c "node dist/db/migrate.js && node dist/main.js"
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { API_URL: "http://api:3001" } }
    depends_on: [api]
    ports: ["3000:3000"]
volumes: { pgdata: {}, minio: {} }
